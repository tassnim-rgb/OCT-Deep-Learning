<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Stylized retinal OCT B-scan illustration">
  <rect width="640" height="480" fill="#0a0f1a"/>
  <defs>
    <linearGradient id="foveaGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="choroid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a4a3d" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2c1d1a" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <!-- soft glow under the foveal pit -->
  <ellipse cx="320" cy="212" rx="120" ry="90" fill="url(#foveaGlow)"/>

  <!-- retina slabs, drawn as filled bands with a gentle foveal dip at center -->
  <path d="M0,150 C130,138 250,158 320,164 C390,170 510,146 640,150 L640,170 C510,166 390,190 320,184 C250,178 130,158 0,170 Z" fill="#3d6a6c" opacity="0.5"/>
  <path d="M0,172 C130,160 250,180 320,186 C390,192 510,168 640,172 L640,196 C510,192 390,216 320,210 C250,204 130,184 0,196 Z" fill="#4d7c80" opacity="0.55"/>
  <path d="M0,198 C130,186 250,206 320,212 C390,218 510,194 640,198 L640,224 C510,220 390,244 320,238 C250,232 130,212 0,224 Z" fill="#55949a" opacity="0.6"/>
  <path d="M0,226 C130,214 250,234 320,240 C390,246 510,222 640,226 L640,250 C510,246 390,270 320,264 C250,258 130,238 0,250 Z" fill="#5aa4a6" opacity="0.6"/>

  <!-- bright reflective RPE band -->
  <path d="M0,254 C130,242 250,262 320,268 C390,274 510,250 640,254 L640,276 C510,272 390,296 320,290 C250,284 130,264 0,276 Z" fill="#d9ecf0" opacity="0.9"/>
  <path d="M0,262 C130,250 250,270 320,276 C390,282 510,258 640,262" stroke="#f4fbfd" stroke-width="1.6" fill="none" opacity="0.9"/>

  <!-- choroid / deeper tissue -->
  <path d="M0,278 C130,266 250,286 320,292 C390,298 510,274 640,278 L640,332 C500,320 380,344 320,338 C260,332 140,312 0,328 Z" fill="url(#choroid)"/>
  <path d="M0,334 C140,320 260,342 320,348 C380,354 500,330 640,338 L640,452 C480,436 320,452 240,444 C160,436 60,424 0,448 Z" fill="#191a24" opacity="0.85"/>

  <!-- scan line (decorative) -->
  <line x1="24" y1="64" x2="616" y2="64" stroke="#2dd4bf" stroke-width="1.4" stroke-dasharray="7 9" opacity="0.8"/>
  <line x1="24" y1="64" x2="150" y2="64" stroke="#2dd4bf" stroke-width="2.4" stroke-linecap="round" opacity="0.95"/>
</svg>